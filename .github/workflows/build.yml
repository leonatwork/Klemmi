name: Build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Toolchain
        run: swift --version
      - name: Test main menu
        run: |
          swiftc Sources/MainMenu.swift Tests/MainMenuTests.swift -framework AppKit -o "$RUNNER_TEMP/MainMenuTests"
          "$RUNNER_TEMP/MainMenuTests"
      - name: Check localizations
        run: scripts/check-localizations.sh
      - name: Build contract regression tests
        run: bash Tests/BuildContractTests.sh
      - name: Build app bundle
        run: ./build.sh
      - name: Verify binary compatibility and signature
        run: |
          bash scripts/check-binary.sh
          codesign --verify --strict dist/Klemmi.app
