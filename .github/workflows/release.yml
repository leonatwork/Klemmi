name: Release

on:
  push:
    tags: ['v*']
  # Manual run: builds and signs without publishing, the zip is kept as an artifact.
  workflow_dispatch:

jobs:
  release:
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Import signing certificate
        id: signing
        env:
          P12: ${{ secrets.MACOS_SIGNING_P12 }}
          P12_PASSWORD: ${{ secrets.MACOS_SIGNING_PASSWORD }}
        run: |
          # Without the secrets the build falls back to ad-hoc signing, as before.
          if [ -z "$P12" ]; then
            echo "::warning::MACOS_SIGNING_P12 is not set, building ad-hoc signed."
            exit 0
          fi
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 16)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          printf '%s' "$P12" | base64 --decode > "$RUNNER_TEMP/codesign.p12"
          security import "$RUNNER_TEMP/codesign.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/codesign.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          echo "CODESIGN_IDENTITY=leonatwork Code Signing" >> "$GITHUB_ENV"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Build
        env:
          # Tag builds use the tag; manual builds fall back to the newest tag in build.sh.
          VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: ./build.sh

      - name: Verify signature
        if: steps.signing.outputs.signed == 'true'
        run: |
          codesign --verify --strict "dist/Klemmi.app"
          # A stable identity shows up as "certificate leaf" in the designated requirement.
          codesign -d -r- "dist/Klemmi.app" 2>&1 | grep "certificate leaf"


      - name: Package
        env:
          VERSION: ${{ github.ref_type == 'tag' && github.ref_name || 'manual' }}
        run: |
          # ditto rather than zip: it preserves the code signature.
          ditto -c -k --keepParent dist/Klemmi.app "Klemmi-${VERSION}.zip"
          shasum -a 256 "Klemmi-${VERSION}.zip" | tee checksum.txt

      - name: Keep manual build
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: Klemmi-manual
          path: Klemmi-manual.zip

      - name: Publish release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
        run: |
          NOTES=$(cat <<'EOF'
          ## Installation

          1. Download and unzip `Klemmi-__VERSION__.zip`
          2. Drag `Klemmi.app` into `/Applications`
          3. On first launch: **right-click ▸ Open** (not a double-click)

          Step 3 is needed because this build is not notarised. Alternatively:

          ```bash
          xattr -dr com.apple.quarantine /Applications/Klemmi.app
          ```

          Klemmi needs no special permissions — it reads the clipboard, which macOS
          does not gate behind a privacy prompt.

          Full changes: [README](https://github.com/leonatwork/Klemmi#readme)
          EOF
          )
          NOTES="${NOTES//__VERSION__/$VERSION}"
          printf '%s\n\n**SHA-256**\n```\n%s\n```\n' "$NOTES" "$(cat checksum.txt)" > notes.md
          gh release create "$VERSION" "Klemmi-${VERSION}.zip" \
            --title "Klemmi $VERSION" --notes-file notes.md
